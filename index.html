<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Fiche de Leçon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .print-container { shadow: none; border: none; padding: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md print-container">
        <!-- Formulaire de saisie -->
        <div class="no-print mb-8 border-b pb-6">
            <h1 class="text-2xl font-bold mb-4 text-orange-600">Générateur de Fiches de Leçon (Sénégal / CEB)</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block font-medium text-gray-700">Titre de la leçon</label>
                    <input type="text" id="titre" placeholder="Ex: Le relief du Sénégal" class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block font-medium text-gray-700">Classe</label>
                    <input type="text" id="classe" placeholder="Ex: CE2" class="w-full border p-2 rounded mt-1">
                </div>
            </div>

            <button onclick="genererFiche()" id="btnSubmit" class="bg-orange-600 text-white px-6 py-2 rounded hover:bg-orange-700 font-semibold">
                Générer la Fiche
            </button>
            <button onclick="window.print()" class="ml-2 bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 font-semibold">
                Imprimer / Exporter PDF
            </button>
        </div>

        <!-- Zone d'affichage de la Fiche -->
        <div id="loading" class="hidden text-center py-8 text-orange-600 font-bold">
            Génération de la fiche de leçon en cours... Veuillez patienter.
        </div>

        <div id="ficheResultat" class="space-y-6 hidden">
            <div class="border-2 border-black p-4">
                <!-- En-tête -->
                <div class="grid grid-cols-3 border-b-2 border-black pb-2 mb-4 font-bold text-sm">
                    <div>Classe: <span id="resClasse" class="font-normal"></span></div>
                    <div>Sous-domaine: <span id="resSousDomaine" class="font-normal"></span></div>
                    <div>Durée: <span id="resDuree" class="font-normal"></span></div>
                </div>

                <!-- Informations générales -->
                <h2 class="font-bold border-b border-black text-lg mb-2">Informations générales</h2>
                <div class="text-sm space-y-1 mb-6">
                    <p><strong>DISCIPLINE :</strong> <span id="resDiscipline"></span></p>
                    <p><strong>CB :</strong> <span id="resCB"></span></p>
                    <p><strong>PALIER :</strong> <span id="resPalier"></span></p>
                    <p><strong>OA :</strong> <span id="resOA"></span></p>
                    <p><strong>OS :</strong> <span id="resOS"></span></p>
                    <p><strong>CONTENUS :</strong> <span id="resContenus"></span></p>
                    <p><strong>MOYENS MATÉRIELS :</strong> <span id="resMateriels"></span></p>
                    <p><strong>DOCUMENTATION :</strong> <span id="resDoc"></span></p>
                </div>

                <!-- Tableau du déroulement -->
                <table class="w-full border-collapse border border-black text-sm">
                    <thead>
                        <tr class="bg-gray-100 border-b border-black">
                            <th class="border border-black p-2 w-1/4 text-left">Étape</th>
                            <th class="border border-black p-2 w-3/8 text-left">Part du Maître</th>
                            <th class="border border-black p-2 w-3/8 text-left">Part des Élèves</th>
                        </tr>
                    </thead>
                    <tbody id="etapesBody">
                        <!-- Les étapes générées apparaîtront ici -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
